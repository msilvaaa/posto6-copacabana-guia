name: Update Airbnb rating

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-airbnb-rating
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read confirmed listing data and rebuild translated pages
        run: |
          python scripts/sync-airbnb-rating.py
          python scripts/build-covers.py
      - name: Save only changed rating and generated pages
        run: |
          git add data/airbnb-rating.json pt/index.html en/index.html es/index.html pt/apartamento/index.html en/apartment/index.html es/apartamento/index.html pt/galeria/index.html en/gallery/index.html es/galeria/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualizar avaliação pública do Airbnb'
          git push origin HEAD:main
