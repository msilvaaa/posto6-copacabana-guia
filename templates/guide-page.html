<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>$title</title>
  <meta name="description" content="$description"/>
  <link rel="stylesheet" href="/site-shell.css?v=20261113-06"/>
  <link rel="stylesheet" href="/guide.css?v=20261113-06"/>
  <script src="/site.js?v=20261113-06" defer></script>
</head>
<body class="site-page guide-document $kind">
  <div class="site-frame guide-layout">

    <main class="site-reading" aria-label="$reading_label" tabindex="0">
    <div class="site-controls">
      $toolbar

    </div>
      $heading
      <div class="guide-canvas" style="aspect-ratio:$width/$height;max-width:${width}px">
        <img class="guide-image" src="$src" alt="$alt" width="$width" height="$height" decoding="async"/>
        $masks
        $americanas
        $photo_upgrade
        <div class="guide-hotspots">$links</div>
      </div>
      $whatsapp
      $source_text
    </main>
    <nav class="site-pagination guide-pagination" aria-label="$pagination_label">$pagination</nav>
  </div>
  $dialogs
</body>
</html>
