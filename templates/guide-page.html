<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>$title</title>
  <meta name="description" content="$description"/>
  <link rel="stylesheet" href="/site-shell.css?v=20261113-04"/>
  <link rel="stylesheet" href="/guide.css?v=20261113-04"/>
  <script src="/site.js?v=20261113-04" defer></script>
</head>
<body class="site-page guide-document $kind">
  <div class="site-frame guide-layout">
    <header class="site-header">
      <div class="site-header-row">$back <button class="site-enlarge" type="button" data-photo-open data-photo-guide data-photo-src="$src" data-photo-alt="$alt" aria-label="$zoom_label"><span aria-hidden="true">⤢</span><span class="enlarge-label">$zoom_label</span></button> $toolbar</div>
      $utilities
      $heading
    </header>
    <main class="site-reading" aria-label="$reading_label" tabindex="0">
      <div class="guide-canvas" style="aspect-ratio:$width/$height;max-width:${width}px">
        <img class="guide-image" src="$src" alt="$alt" width="$width" height="$height" decoding="async"/>
        $masks
        $americanas
        $photo_upgrade
        <div class="guide-hotspots">$links</div>
      </div>
      $whatsapp
      $source_text
    </main>
    <nav class="site-pagination guide-pagination" aria-label="$pagination_label">$pagination</nav>
  </div>
  $dialogs
</body>
</html>
